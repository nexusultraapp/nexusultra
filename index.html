    <style>
        :root {
            --bg-deep: #060312;
            --bg-color: #0d091e;
            --panel-bg: rgba(25, 20, 48, 0.6);
            --panel-border: rgba(255, 110, 199, 0.2);
            --accent-pink: #ff2a8d;
            --accent-purple: #9d4edd;
            --accent-cyan: #00f5d4;
            --accent-orange: #ff9e00;
            --text-main: #ffffff;
            --text-muted: #c4bbf0;
            --success: #06d6a0;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(6, 3, 18, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 110, 199, 0.1);
            transition: var(--transition);
        }

        .navbar.scrolled {
            padding: 12px 60px;
            background: rgba(6, 3, 18, 0.95);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.5);
        }

        .nav-brand-text {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
            color: white !important;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700 !important;
            box-shadow: 0 4px 20px rgba(255, 42, 141, 0.3);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 42, 141, 0.5);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .hamburger span {
            width: 26px;
            height: 2.5px;
            background: white;
            border-radius: 2px;
            transition: var(--transition);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 60px 80px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            left: -200px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 42, 141, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -200px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-cyan);
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-badge .dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
        }

        .hero h1 .gradient-text {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.7;
            max-width: 480px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 6px 30px rgba(255, 42, 141, 0.4);
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(255, 42, 141, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Hero Visual */
        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-mockup {
            width: 100%;
            max-width: 560px;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 42, 141, 0.1);
            position: relative;
        }

        .mockup-titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            background: rgba(14, 10, 28, 0.95);
            border-bottom: 1px solid rgba(255, 110, 199, 0.1);
        }

        .mockup-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .mockup-dot.red { background: #ff5f57; }
        .mockup-dot.yellow { background: #ffbd2e; }
        .mockup-dot.green { background: #28c840; }

        .mockup-titlebar-text {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .mockup-body {
            display: grid;
            grid-template-columns: 70px 1fr;
            min-height: 300px;
        }

        .mockup-sidebar {
            background: rgba(14, 10, 28, 0.98);
            border-right: 1px solid rgba(255, 110, 199, 0.1);
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .mockup-sidebar-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .mockup-sidebar-icon.active {
            background: linear-gradient(135deg, rgba(255, 42, 141, 0.25), rgba(157, 78, 221, 0.3));
            color: var(--accent-pink);
        }

        .mockup-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mockup-header {
            font-size: 1rem;
            font-weight: 700;
        }

        .mockup-input-row {
            display: flex;
            gap: 8px;
        }

        .mockup-input {
            flex: 1;
            background: rgba(15, 11, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .mockup-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            color: white;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .mockup-progress-item {
            background: rgba(30, 20, 60, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mockup-progress-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .mockup-progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .mockup-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--success));
            border-radius: 3px;
            animation: progressAnim 3s ease-in-out infinite;
        }

        @keyframes progressAnim {
            0% { width: 30%; }
            50% { width: 85%; }
            100% { width: 30%; }
        }

        .mockup-progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            color: var(--text-muted);
        }

        .float-card {
            position: absolute;
            background: rgba(25, 20, 48, 0.95);
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: float 4s ease-in-out infinite;
            z-index: 2;
        }

        .float-card.card-1 {
            top: -20px;
            right: -30px;
            animation-delay: 0s;
        }

        .float-card.card-2 {
            bottom: -15px;
            left: -25px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .float-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .float-icon.cyan { background: rgba(0, 245, 212, 0.15); color: var(--accent-cyan); }
        .float-icon.pink { background: rgba(255, 42, 141, 0.15); color: var(--accent-pink); }

        .float-text {
            display: flex;
            flex-direction: column;
        }

        .float-text strong {
            font-size: 0.78rem;
            font-weight: 700;
        }

        .float-text span {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* ===== FEATURES ===== */
        .features {
            padding: 100px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 14px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .feature-card {
            background: rgba(20, 15, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
            opacity: 0;
            transition: var(--transition);
        }

        .feature-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 110, 199, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .feature-icon.pink { background: rgba(255, 42, 141, 0.12); color: var(--accent-pink); }
        .feature-icon.cyan { background: rgba(0, 245, 212, 0.12); color: var(--accent-cyan); }
        .feature-icon.purple { background: rgba(157, 78, 221, 0.12); color: var(--accent-purple); }
        .feature-icon.orange { background: rgba(255, 158, 0, 0.12); color: var(--accent-orange); }
        .feature-icon.green { background: rgba(6, 214, 160, 0.12); color: var(--success); }

        .feature-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .feature-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.65;
        }

        /* ===== HOW IT WORKS ===== */
        .how-it-works {
            padding: 100px 60px;
            background: linear-gradient(180deg, transparent 0%, rgba(25, 20, 48, 0.3) 50%, transparent 100%);
        }

        .steps-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
        }

        .steps-container::before {
            content: '';
            position: absolute;
            left: 32px;
            top: 40px;
            bottom: 40px;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-pink), var(--accent-purple), var(--accent-cyan));
            opacity: 0.3;
        }

        .step-item {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding: 30px 0;
        }

        .step-number {
            width: 64px;
            height: 64px;
            min-width: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .step-number.pink { background: rgba(255, 42, 141, 0.15); color: var(--accent-pink); border: 1px solid rgba(255, 42, 141, 0.3); }
        .step-number.purple { background: rgba(157, 78, 221, 0.15); color: var(--accent-purple); border: 1px solid rgba(157, 78, 221, 0.3); }
        .step-number.cyan { background: rgba(0, 245, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 245, 212, 0.3); }

        .step-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .step-content p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .step-content code {
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--accent-cyan);
            font-family: 'Courier New', monospace;
        }

        /* ===== PLATFORMS ===== */
        .platforms {
            padding: 100px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        .platform-card {
            background: rgba(20, 15, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
        }

        .platform-card:hover {
            border-color: rgba(255, 42, 141, 0.3);
            transform: translateY(-3px);
        }

        .platform-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .platform-name {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .platform-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ===== TECH SPECS ===== */
        .specs {
            padding: 100px 60px;
            background: linear-gradient(180deg, transparent 0%, rgba(25, 20, 48, 0.3) 50%, transparent 100%);
        }

        .specs-grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .spec-row {
            background: rgba(20, 15, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .spec-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(157, 78, 221, 0.1);
            color: var(--accent-purple);
        }

        .spec-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spec-value {
            font-size: 0.92rem;
            font-weight: 700;
            margin-top: 2px;
        }

        /* ===== DOWNLOAD CTA ===== */
        .download-section {
            padding: 100px 60px;
            text-align: center;
        }

        .download-box {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(255, 42, 141, 0.1), rgba(157, 78, 221, 0.1), rgba(0, 245, 212, 0.1));
            border: 1px solid rgba(255, 110, 199, 0.2);
            border-radius: 28px;
            padding: 60px 50px;
            position: relative;
            overflow: hidden;
        }

        .download-box::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 42, 141, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .download-box::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .download-box h2 {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 14px;
            position: relative;
        }

        .download-box p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 32px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .download-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 28px;
            position: relative;
        }

        .download-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .download-info-item i {
            color: var(--accent-cyan);
        }

        /* ===== FAQ ===== */
        .faq {
            padding: 100px 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 0;
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 16px;
        }

        .faq-question h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .faq-toggle {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            transition: var(--transition);
            min-width: 32px;
        }

        .faq-item.open .faq-toggle {
            transform: rotate(45deg);
            background: rgba(255, 42, 141, 0.15);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .faq-item.open .faq-answer {
            max-height: 200px;
            padding-top: 14px;
        }

        .faq-answer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== FOOTER ===== */
        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 50px 60px 30px;
        }

        .footer-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-brand p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.7;
            margin-top: 14px;
            max-width: 280px;
        }

        .footer-col h4 {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .footer-col a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 4px 0;
            transition: var(--transition);
        }

        .footer-col a:hover {
            color: var(--accent-cyan);
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .footer-bottom span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .footer-socials {
            display: flex;
            gap: 12px;
        }

        .footer-socials a {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-socials a:hover {
            background: rgba(255, 42, 141, 0.2);
            border-color: var(--accent-pink);
            color: white;
        }
    </style>
